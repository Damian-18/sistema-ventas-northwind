<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo | Northwind</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="catalogo-productos.css">
</head>
<body>
  <header class="site-header">
    <nav class="navigation" aria-label="Navegación principal">
      <a class="brand" href="catalogo-productos.html"><i class="fa-solid fa-store" aria-hidden="true"></i> Northwind</a>
      <div class="navigation-links">
        <a class="navigation-link active" href="catalogo-productos.html"><i class="fa-solid fa-table-cells-large" aria-hidden="true"></i> Catálogo</a>
        <a class="navigation-link" href="index.html"><i class="fa-solid fa-pen-to-square" aria-hidden="true"></i> CRUD de productos</a>
      </div>
    </nav>
  </header>

  <main class="catalog-container">
    <section class="catalog-heading">
      <p class="eyebrow">Northwind · Productos</p>
      <h1>Encuentra tu producto</h1>
      <p>Explora el catálogo y carga más productos desplazándote hacia el final.</p>
    </section>

    <section class="search-panel" aria-label="Filtro de productos">
      <label class="search-box" for="txtBuscar">
        <i class="fa-solid fa-filter" aria-hidden="true"></i>
        <span class="sr-only">Buscar productos</span>
        <input id="txtBuscar" type="search" placeholder="Buscar por nombre o presentación..." autocomplete="off">
      </label>
      <button id="btnBuscar" class="search-button" type="button">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <span>Buscar</span>
      </button>
    </section>

    <div class="status-row" aria-live="polite">
      <div id="loading" class="status-message loading-message hidden">
        <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
        <span>Cargando productos...</span>
      </div>
      <div id="ready" class="status-message ready-message">Listo</div>
    </div>

    <section id="productos" class="products-grid" aria-live="polite" aria-label="Productos"></section>
    <div id="sentinel" class="sentinel" aria-hidden="true"></div>
  </main>

  <dialog id="detailsDialog" class="details-dialog">
    <div class="dialog-heading">
      <h2 id="detailsTitle">Detalles del producto</h2>
      <button id="closeDetails" class="icon-button" type="button" aria-label="Cerrar detalles"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </div>
    <div id="detailsContent"></div>
  </dialog>

  <script src="catalogo-productos.js" defer></script>
</body>
</html>
